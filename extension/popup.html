<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoMind Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="extension-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
        </div>
        <div class="brand-text">
          <h1>EchoMind</h1>
          <p>Meeting Assistant</p>
        </div>
      </div>
      <div id="connection-badge" class="badge disconnected">Disconnected</div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Auth Sync Screen (Visible when disconnected) -->
      <div id="auth-sync-panel" class="panel">
        <div class="info-card">
          <svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <h3>Connection Required</h3>
          <p>Please open and log in to the EchoMind app in your browser to sync your account.</p>
          <button id="open-app-btn" class="btn primary-btn">
            Open EchoMind App
          </button>
        </div>
      </div>

      <!-- Active Control Panel (Visible when connected) -->
      <div id="control-panel" class="panel hidden">
        <!-- User Info -->
        <div class="user-greeting">
          <span class="user-avatar" id="avatar-letter">U</span>
          <div>
            <p class="greeting-lbl">Logged in as</p>
            <p class="user-name" id="user-display-name">Loading User...</p>
          </div>
        </div>

        <!-- Settings / Title Input -->
        <div class="recording-inputs" id="inputs-group">
          <label for="meeting-title" class="input-label">Meeting Title</label>
          <input type="text" id="meeting-title" class="text-input" placeholder="Daily Standup..." />
        </div>

        <!-- Recording State Interface -->
        <div class="recording-state-container">
          <!-- Soundwave placeholder/animation when recording -->
          <div class="visualizer-container hidden" id="visualizer-anim">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
          
          <div class="timer-display hidden" id="timer-val">00:00</div>
          <p class="status-msg" id="status-text">Ready to record tab audio</p>
        </div>

        <!-- Primary Control Trigger -->
        <button id="record-trigger-btn" class="btn record-btn">
          <svg class="record-icon" id="record-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
          <span id="record-btn-text">Start Recording Tab</span>
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <a href="#" id="view-dashboard-link">View Dashboard</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
